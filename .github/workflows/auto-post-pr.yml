name: Auto-open post PR

on:
  push:
    branches: ["post/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (prs.length) return;
            const title = 'Post: ' + branch.replace('post/', '').replace(/-/g, ' ');
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'main',
              title,
              body: [
                'Weekly blog post — review and **merge to publish** (Vercel deploys from `main`).',
                '',
                '**Checklist:**',
                '- [ ] Voice sounds like me',
                '- [ ] Facts/code verified',
                '- [ ] 3–5 min read',
                '- [ ] Excerpt works as meta description',
                '',
                'Suggested merge time: Tuesday ~9am CET.',
              ].join('\n'),
            });
